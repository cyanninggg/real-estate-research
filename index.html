<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyan Li | Real Estate Research</title><meta name="description" content="Cyan Li: real estate development and asset analysis. Boston multifamily research, operating models, lease economics and development feasibility.">
<style>

:root{
  --bg:#EEF1F0; --panel:#FFFFFF; --ink:#1C2730; --muted:#5C6770; --line:#D2D8DB;
  --granite:#8A9399; --green:#00733A; --green-soft:#D9EEE2; --warn:#9A5B00; --bar-list:#B9C2C7; --bar-tenant:#4F7A92; --bar-owner:#00733A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A1E; --panel:#1C242A; --ink:#E4E9EB; --muted:#9AA6AD; --line:#2F3A41;
    --granite:#6E7A81; --green:#3FB37A; --green-soft:#183A2A; --warn:#E0A44A; --bar-list:#4A565D; --bar-tenant:#6FA3BF; --bar-owner:#3FB37A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1E; --panel:#1C242A; --ink:#E4E9EB; --muted:#9AA6AD; --line:#2F3A41;
  --granite:#6E7A81; --green:#3FB37A; --green-soft:#183A2A; --warn:#E0A44A; --bar-list:#4A565D; --bar-tenant:#6FA3BF; --bar-owner:#3FB37A;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6;font-variant-numeric:tabular-nums;}
a{color:var(--green);text-underline-offset:2px;}
a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:2px;}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
.prose{max-width:690px;}
h1,h2,h3{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:500;line-height:1.15;margin:0;}
h2{font-size:clamp(1.7rem,3.2vw,2.3rem);margin-bottom:.6em;}
h3{font-size:1.25rem;margin:1.6em 0 .4em;}
p{margin:0 0 1em;}
.muted{color:var(--muted);}
.small{font-size:.86rem;}

/* Hero */
.hero{padding:56px 0 40px;border-bottom:1px solid var(--line);}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:end;}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);letter-spacing:-.01em;}
.hero .dek{font-size:1.1rem;color:var(--muted);margin-top:18px;max-width:560px;}
.byline{margin-top:22px;font-size:.92rem;color:var(--muted);}
.readout{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--green);padding:26px 26px 22px;}
.readout .label{font-size:.95rem;color:var(--muted);}
.readout .value{font-family:"Newsreader",Georgia,serif;font-size:clamp(3rem,7vw,4.6rem);line-height:1;margin:6px 0 4px;}
.readout .sub{font-size:.95rem;color:var(--muted);}
.ctrl{margin-top:18px;}
.ctrl label{display:flex;justify-content:space-between;font-size:.92rem;font-weight:500;}
.ctrl output{font-weight:600;color:var(--green);}
input[type=range]{width:100%;accent-color:var(--green);margin:6px 0 0;}

/* Sections */
section{padding:56px 0;border-bottom:1px solid var(--line);}
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:8px;}
.finding .big{font-family:"Newsreader",Georgia,serif;font-size:2.1rem;line-height:1.1;color:var(--green);}
.finding p{margin-top:8px;font-size:.98rem;}

.table-scroll{overflow-x:auto;margin:16px 0 8px;}
table{border-collapse:collapse;width:100%;font-size:.94rem;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-weight:600;color:var(--muted);font-size:.86rem;}
td.num,th.num{text-align:right;white-space:nowrap;}
tr.total td{font-weight:700;border-top:2px solid var(--ink);}
tr.sub td{font-weight:600;}
td .note{display:block;font-size:.8rem;color:var(--muted);}
.facts td:first-child{color:var(--muted);width:38%;}

.chart{margin:20px 0 6px;}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:.86rem;color:var(--muted);margin-top:6px;}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--c);}

.callout{background:var(--green-soft);padding:18px 22px;margin:20px 0;max-width:690px;}
.callout p:last-child{margin-bottom:0;}

/* Model */
.model-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start;}
.inputs{background:var(--panel);border:1px solid var(--line);padding:20px 22px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));}
.inputs h3{margin-top:0;}
.inputs .ctrl{margin-top:14px;}
.inputs .hint{font-size:.78rem;color:var(--muted);margin-top:2px;}
.reset{margin-top:18px;font:inherit;font-size:.9rem;background:transparent;color:var(--green);border:1px solid var(--green);padding:6px 14px;cursor:pointer;}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px;}
.kpi{background:var(--panel);padding:14px 16px;}
.kpi .k{font-size:.82rem;color:var(--muted);}
.kpi .v{font-family:"Newsreader",Georgia,serif;font-size:1.7rem;line-height:1.2;}
.sens td.num{font-size:.88rem;}
.sens td.base{background:var(--green-soft);font-weight:700;}
.sens th.corner{font-weight:500;}
.pos{color:var(--green);font-weight:600;}
.neg{color:var(--warn);font-weight:600;}

.risks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;}
.risks h3{margin-top:0;}
ul.plain{padding-left:1.1em;margin:0;}
ul.plain li{margin-bottom:.5em;}
.sources li{margin-bottom:.45em;font-size:.9rem;}
footer{padding:36px 0 56px;font-size:.86rem;color:var(--muted);}

@media (max-width:860px){
  .hero-grid,.model-grid,.risks{grid-template-columns:1fr;gap:28px;}
  .findings{grid-template-columns:1fr;gap:22px;}
  .inputs{position:static;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (prefers-reduced-motion:no-preference){
  .readout .value{transition:color .2s;}
}

/* Site chrome */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);}
.topbar .wrap{display:flex;align-items:center;gap:24px;min-height:60px;}
.brand{font-family:"Newsreader",Georgia,serif;font-size:1.2rem;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap;}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;}
.nav::-webkit-scrollbar{display:none;}
.nav a{color:var(--muted);text-decoration:none;padding:8px 12px;font-size:.93rem;font-weight:500;white-space:nowrap;border-radius:4px;}
.nav a:hover{color:var(--ink);background:var(--bg);}
.nav a.on{color:var(--green);background:var(--green-soft);}
.crumbs{font-size:.9rem;color:var(--muted);padding-top:28px;}
.crumbs a{color:var(--muted);}
.bhead{padding:12px 0 0;}
.bhead h1{font-size:clamp(2.1rem,4.6vw,3.4rem);}
.bhead .meta{color:var(--muted);margin-top:10px;}
.status{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);margin-left:10px;vertical-align:middle;}
.status.wip{background:var(--bg);color:var(--warn);border:1px solid var(--line);}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:28px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs a{padding:12px 16px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;}
.tabs a:hover{color:var(--ink);}
.tabs a.on{color:var(--ink);border-bottom-color:var(--green);}
.page section:first-child{padding-top:36px;}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px;}
.card{display:block;background:var(--panel);border:1px solid var(--line);padding:22px;text-decoration:none;color:var(--ink);transition:border-color .15s;}
.card:hover{border-color:var(--green);}
.card h3{margin:0 0 4px;font-size:1.45rem;}
.card .where{color:var(--muted);font-size:.9rem;}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:.92rem;}
.card dt{color:var(--muted);}
.card dd{margin:0;text-align:right;font-weight:600;}
.card .go{margin-top:16px;color:var(--green);font-weight:600;font-size:.92rem;}
.card.soon{border-style:dashed;background:transparent;}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px;}
.stat{background:var(--panel);padding:16px 18px;}
.stat .v{font-family:"Newsreader",Georgia,serif;font-size:2rem;line-height:1.1;}
.stat .k{font-size:.85rem;color:var(--muted);margin-top:4px;}
.gap{border:1px dashed var(--line);padding:18px 22px;margin:18px 0;max-width:690px;}
.gap h3{margin-top:0;font-size:1.05rem;font-family:"Public Sans",system-ui,sans-serif;font-weight:600;}
@media (max-width:860px){
  .cards{grid-template-columns:1fr;}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .topbar .wrap{gap:12px;}
  .brand{font-size:1.05rem;}
}

/* Editorial research style: type, spacing and rules instead of boxes. */
:root{--bg:#fff;--panel:#fff;--ink:#202624;--muted:#69706c;--line:#dfe3df;--green:#294b3d;--green-soft:#f8f9f6}

(function(){
"use strict";
/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function money(n){var neg=n<0; n=Math.abs(n); var s="$"+Math.round(n).toLocaleString("en-US"); return neg?"("+s+")":s;}
function mShort(n){ if(Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(1)+"M"; return "$"+Math.round(n/1000)+"K"; }
function kShort(n){return "$"+Math.round(n/1000)+"K";}
function sM(n){return (n<0?"\u2212":"+")+mShort(Math.abs(n));}
function pct(n,d){return (n*100).toFixed(d==null?1:d)+"%";}
function months(n){return (n%1===0?n.toFixed(0):n.toFixed(1))+(n===1?" month":" months");}
function setText(id,v){var el=$(id); if(el) el.textContent=v;}
function row(cells,numFrom,cls){var tr=document.createElement("tr"); if(cls) tr.className=cls; cells.forEach(function(v,i){var td=document.createElement("td"); td.textContent=v; if(i>=numFrom) td.className="num"; tr.appendChild(td);}); return tr;}

/* ---------- shared data ---------- */
var COMPS=[
  {k:"hew",b:"Hew at 1515",units:150,vacant:6,unit:"1B5, 677 sq ft",rent:4076,free:2,broker:1},
  {k:"harper",b:"Harper",units:260,vacant:32,unit:"A3, 651 sq ft",rent:3457,free:2.5,broker:1}
];
COMPS.forEach(function(c){c.tenant=c.rent*(12-c.free)/12; c.owner=c.rent*(12-c.free-c.broker)/12; c.occ=1-c.vacant/c.units;});

/* ---------- Hew model ---------- */
var MIX=[
  {t:"Studio",u:39,sf:465,r:3184},
  {t:"One-bedroom",u:41,sf:655,r:3950},
  {t:"One-bedroom + den",u:14,sf:830,r:4090},
  {t:"Two-bedroom",u:28,sf:960,r:4600},
  {t:"Two-bedroom + den",u:1,sf:1181,r:5200}
];
var AFF_UNITS=27, AFF_SF=600, UNITS=150, CONDO_PSF=1071;
var FIXED={internet:70, parkRate:300, petPen:0.25, pet:50, insPen:0.40, ins:14.5, misc:15000, mgmt:0.03, tax:0.012524};
var BASE={turn:35, free:2, broker:1, renew:1, vac:4, cap:5.0, opex:7180, aff:2700, park:35};
var S=Object.assign({},BASE);
var DBASE={cost:600000,spread:1.25}; var D=Object.assign({},DBASE);
var LAND=15750000*150/252;
var totalSf=MIX.reduce(function(a,m){return a+m.u*m.sf;},0)+AFF_UNITS*AFF_SF;

function model(s){
  var gprM=MIX.reduce(function(a,m){return a+m.u*m.r;},0)*12;
  var gprA=AFF_UNITS*s.aff*12, gpr=gprM+gprA, vac=gpr*s.vac/100, t=s.turn/100;
  var conc=gprM*(t*(s.free+s.broker)+(1-t)*s.renew)/12, nri=gpr-vac-conc;
  var oInternet=UNITS*FIXED.internet*12, oPark=s.park*FIXED.parkRate*12, oPet=UNITS*FIXED.petPen*FIXED.pet*12, oIns=UNITS*FIXED.insPen*FIXED.ins*12;
  var other=oInternet+oPark+oPet+oIns+FIXED.misc, egi=nri+other, opex=UNITS*s.opex, mgmt=egi*FIXED.mgmt;
  var noiPre=egi-opex-mgmt, cap=s.cap/100, value=noiPre/(cap+FIXED.tax), tax=value*FIXED.tax, noi=noiPre-tax;
  return {gprM:gprM,gprA:gprA,gpr:gpr,vac:vac,conc:conc,nri:nri,oInternet:oInternet,oPark:oPark,oPet:oPet,oIns:oIns,oMisc:FIXED.misc,other:other,egi:egi,opex:opex,mgmt:mgmt,tax:tax,noi:noi,value:value,perUnit:value/UNITS,perSf:value/totalSf,expRatio:(opex+mgmt+tax)/egi};
}
var BASER=model(BASE);

/* ---------- page templates ---------- */
function compTableHTML(){
  return '<div class="table-scroll"><table><thead><tr><th>Building</th><th class="num">Units</th><th class="num">Listing-implied occupancy</th><th>One-bedroom compared</th><th class="num">Listed rent</th><th class="num">Free rent</th><th class="num">Broker fee</th><th class="num">Renter pays</th><th class="num">Owner keeps</th></tr></thead><tbody id="compBody"></tbody></table></div>'+
  '<div class="chart" id="compChart" role="img" aria-label="Bar chart comparing listed rent, what the renter pays and what the owner keeps for Hew and Harper (October 18 historical snapshot)."></div>'+
  '<div class="legend"><span style="--c:var(--bar-list)">Listed rent</span><span style="--c:var(--bar-tenant)">Renter pays after free rent</span><span style="--c:var(--bar-owner)">Owner keeps after free rent and broker fee</span></div>';
}
function fillComps(){
  var tb=$("compBody"); if(!tb) return; tb.textContent="";
  COMPS.forEach(function(c){tb.appendChild(row([c.b,String(c.units),pct(c.occ,0),c.unit,money(c.rent),months(c.free),c.broker?months(c.broker):"None",money(c.tenant),money(c.owner)],4));
    var tds=tb.lastChild.children; tds[1].className="num"; tds[2].className="num";});
  drawChart();
}
function drawChart(){
  var host=$("compChart"); if(!host) return; host.textContent="";
  var w=Math.max(300,host.clientWidth||700), rowH=78, left=Math.min(130,w*0.28), right=70, top=6, h=top+COMPS.length*rowH, scale=(w-left-right)/4200;
  var ns="http://www.w3.org/2000/svg", svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h); svg.setAttribute("width","100%"); svg.setAttribute("aria-hidden","true");
  COMPS.forEach(function(c,i){
    var y0=top+i*rowH, lbl=document.createElementNS(ns,"text");
    lbl.setAttribute("x",0); lbl.setAttribute("y",y0+36); lbl.setAttribute("fill","var(--ink)"); lbl.setAttribute("font-size","14"); lbl.setAttribute("font-weight","600"); lbl.textContent=c.b; svg.appendChild(lbl);
    [["rent","var(--bar-list)"],["tenant","var(--bar-tenant)"],["owner","var(--bar-owner)"]].forEach(function(s,j){
      var y=y0+4+j*22, bw=c[s[0]]*scale, r=document.createElementNS(ns,"rect");
      r.setAttribute("x",left); r.setAttribute("y",y); r.setAttribute("width",bw); r.setAttribute("height",16); r.setAttribute("fill",s[1]); svg.appendChild(r);
      var t=document.createElementNS(ns,"text"); t.setAttribute("x",left+bw+6); t.setAttribute("y",y+13); t.setAttribute("fill","var(--muted)"); t.setAttribute("font-size","12.5"); t.textContent=money(c[s[0]]); svg.appendChild(t);
    });
  });
  host.appendChild(svg);
}

/* ---------- HOME ---------- */
function homeHTML(){return '<div class="page"><header class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">CYAN LI / DEVELOPMENT & ASSET ANALYSIS</div><h1>Real estate.<br>Development & asset analysis.</h1><p class="dek">I study how location, lease terms and development costs shape apartment returns. These Greater Boston case studies turn public market data into operating models and investment questions.</p><p class="byline">Cyan Li · Boston, MA<br>Seeking Development Analyst and Asset Management Analyst roles <a href="resume.pdf" target="_blank" rel="noopener" download>Download resume</a></p><p class="byline"><a href="mailto:cyanningg@outlook.com">cyanningg@outlook.com</a> · <a href="https://www.linkedin.com/in/cyan-li-3b8483256/" target="_blank" rel="noopener">LinkedIn</a></p><div class="hero-actions"><a class="primary" href="#/b/hew/asset">View the operating model ↗</a><a class="secondary" href="#/b/everett/renter">Open Everett analysis →</a></div></div><div class="readout"><div class="label">HEW / BASE-CASE VALUE</div><div class="value">'+mShort(BASER.value)+'</div><div class="sub">'+kShort(BASER.perUnit)+' per apartment under the model assumptions.</div><div class="ctrl"><a class="primary" href="#/b/hew/asset">Open cash-flow model →</a></div></div></div></header><section><div class="wrap"><div class="home-results"><div class="section-kicker">RESEARCH FINDINGS</div><h2>Two cases. Two investment questions.</h2><div class="finding-grid"><article><h3>Hew: value below assumed cost</h3><p>$73.2M modeled value versus a $90M development-cost scenario. Concessions reduce annual income by about $812K.</p><a class="secondary" href="#/b/hew/overview">Read the Hew & Harper results →</a></article><article><h3>Everett: a $55M income hurdle</h3><p>A 6.25% yield on the reported $880M program requires $55M of annual NOI. Current listings test pricing, not realized returns.</p><a class="secondary" href="#/b/everett/overview">Read the Everett results →</a></article></div><p class="basis-note">Independent analysis based on public data and stated assumptions. Estimates are not owner-reported results. <a href="#/method">Method →</a></p></div><h2>Two case studies</h2><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">'+card("hew","Hew & Harper","Allston–Brighton",[["Focus","Location, rent and operating income"],["Apartments","150 at Hew; about 260 at Harper"],["Model","Hew cash flow and value"],["Comparison","Harper pricing and demand"]],"Open case study")+card("everett","Greystar · Everett Triangle","Mason · Maxwell · Jade · Anthem · Juniper",[["Focus","Leasing and development"],["Apartments","1,905 across five projects"],["Listing sample","286 advertised units"],["Model","Concessions and development scenarios"]],"Open case study")+'</div></div></section><section><div class="wrap"><h2>From asking rent to asset value</h2><div class="findings"><div><h3>1. Start with the lease</h3><p>Compare rent, free weeks and broker costs. Ask what the renter pays and what the owner keeps.</p></div><div><h3>2. Build operating income</h3><p>Allow for vacancy, fees and expenses. Show how each assumption changes net operating income.</p></div><div><h3>3. Test the cost to build</h3><p>Compare income and value with development cost. Test different costs and required returns.</p></div></div></div></section><section><div class="wrap prose"><h2>About Cyan</h2><p>I graduated in 2025 with degrees in Economics and International Relations. My background combines Boston residential leasing, economic research and financial-market data.</p><p>In leasing, I track asking rents, concessions and seasonal demand. My research work included organizing and validating data on infrastructure financing across more than 40 countries. This portfolio builds on that experience to explore property income, value and development feasibility.</p><p>I am interested in Development Analyst and Asset Management Analyst roles where I can connect market research with financial analysis. The models here are independent work samples built from public data and stated assumptions.</p><h3>Tools and background</h3><p>Excel · SQL · Python · English and Mandarin<br>B.A. Economics and B.A. International Relations</p><div class="hero-actions"><a href="https://www.linkedin.com/in/cyan-li-3b8483256/" target="_blank" rel="noopener">LinkedIn ↗</a><a href="mailto:cyanningg@outlook.com">Email Cyan →</a></div></div></section><section><div class="wrap"><h2>Next in the study</h2><p><a href="#/study">Can a Hew-Style Building Still Pencil? A Brighton Development Feasibility Study →</a></p><p>1550 on the Charles: the 2022 sale and today’s valuation assumptions. Lyra, Fenway: development cost and lease-up.</p><a href="#/method">Sources and assumptions →</a></div></section></div>';}

var LOCAL_COMPANION={"overview": "<section><div class=\"wrap prose\"><h2>Asset management question</h2><p>How much rent does an owner keep after vacancy, free rent and broker costs? Hew is the operating case. Harper helps test whether its rent premium is supported by location and renter demand.</p><p>Actual owner operating statements and renewal data are unavailable. The model uses disclosed assumptions and sensitivity tables rather than presenting estimates as reported performance.</p></div></section><section><div class=\"wrap\"><h2>Harper: a check on Hew\u2019s location premium</h2><p>Harper is the comparison case. In my leasing experience, its one-bedrooms can be hard to justify at the current price: students watching their budget may share a two-bedroom, while those willing to spend more may choose a home closer to campus.</p><p>Hew benefits from a broader university and medical-area renter base. That is a market observation to test, not a claim that location alone explains the rent gap.</p><div class=\"table-scroll\"><table><thead><tr><th>Property</th><th>Typical new-lease offer</th><th>Broker cost</th><th>Study role</th></tr></thead><tbody><tr><td>Hew</td><td>2 months free</td><td>1 month</td><td>Operating model</td></tr><tr><td>Harper</td><td>2.5 months free</td><td>1 month</td><td>Pricing comparison</td></tr></tbody></table></div><p class=\"small muted\">Offers can vary by unit and lease date. Harper\u2019s typical term is 12 months. Use the actual signed terms for a specific lease.</p></div></section>", "renter": "<section><div class=\"wrap\"><h2>Harper: price versus the commute</h2><div class=\"table-scroll\"><table><thead><tr><th>Plan</th><th>Area</th><th>Monthly asking rent</th></tr></thead><tbody><tr><td>Studio S1</td><td>458\u2013466 sf</td><td>$2,945\u20133,065</td></tr><tr><td>1BR A1 / A2</td><td>622\u2013629 sf</td><td>$3,330\u20133,351</td></tr><tr><td>1BR A3</td><td>621\u2013651 sf</td><td>$3,369\u20133,499</td></tr><tr><td>1BR A4</td><td>752 sf</td><td>$3,510\u20133,530</td></tr><tr><td>2BR B1</td><td>926 sf</td><td>$4,722\u20134,732</td></tr><tr><td>2BR B8</td><td>1,084 sf</td><td>$4,951</td></tr></tbody></table></div><p>Two people sharing a B1 pay about $2,361\u20132,366 each before incentives. A person renting an A1 / A2 alone pays about $964\u2013990 more. A studio offers a cheaper way to live alone. Compare that saving with the commute and the lease terms.</p><p>On a 12-month lease with 2.5 months free, renter effective rent is contract rent \u00d7 9.5 / 12. After a one-month broker fee, the owner keeps contract rent \u00d7 8.5 / 12 before other costs.</p></div></section><section><div class=\"wrap\"><h2>Harper: what the current listings suggest</h2><div class=\"table-scroll\"><table><thead><tr><th>Type</th><th>Listed</th><th>Future availability</th><th>Estimated vacant now</th><th>Estimated stock</th></tr></thead><tbody><tr><td>Studio</td><td>6</td><td>0</td><td>6</td><td>~80</td></tr><tr><td>1BR</td><td>32</td><td>2</td><td>30</td><td>~120</td></tr><tr><td>2BR</td><td>3</td><td>2</td><td>1</td><td>~50</td></tr><tr><td>Total</td><td>41</td><td>4</td><td>37</td><td>~260 overall</td></tr></tbody></table></div><p>One-bedrooms account for most listed units. Using the estimated stock, about 25% of one-bedrooms are vacant. The stock estimates add to 250, leaving about 10 units unclassified. Treat this as a working estimate, not a verified rent roll.</p><p class=\"small muted\">The update date for these 41 listings is not confirmed. Keep it separate from the October 18 comparison.</p></div></section><section><div class=\"wrap\"><h2>Harper: other income</h2><p>Parking is $300 per paid space per month; pet rent is $75 per chargeable pet. Internet, utilities and required insurance are handled separately. Storage is listed at $0. The $600 move-in payment goes toward rent and is not additional income.</p><p>Annual gross parking and pet income = paid spaces \u00d7 $300 \u00d7 12 + chargeable pets \u00d7 $75 \u00d7 12. The number of paying users is still needed.</p></div></section>", "asset": "<section><div class=\"wrap\"><h2>Use Harper to test the Hew assumptions</h2><p>Track asking rent, signed rent, free rent and time to lease by bedroom count. Check whether a lower price improves one-bedroom leasing before changing the assumed unit mix.</p><p>Harper still needs a complete unit schedule, actual occupancy, renewal terms and expenses before it can support a separate valuation model.</p></div></section>", "development": "<section><div class=\"wrap\"><h2>Harper: opening at the wrong time</h2><p>My market observation is that Harper opened August 31, 2025, after much of the student leasing season, and occupancy remained very low through March 2026. A recalled estimate of roughly 3\u20134% needs monthly records before it can be used in cash-flow calculations.</p><p>Compare the timing risk with Hew, but do not infer Harper\u2019s development return without land cost, total budget and lease-up cash flow.</p></div></section>", "compare": "<section><div class=\"wrap\"><h2>Harper: a check on Hew\u2019s location premium</h2><p>Harper is the comparison case. In my leasing experience, its one-bedrooms can be hard to justify at the current price: students watching their budget may share a two-bedroom, while those willing to spend more may choose a home closer to campus.</p><p>Hew benefits from a broader university and medical-area renter base. That is a market observation to test, not a claim that location alone explains the rent gap.</p><div class=\"table-scroll\"><table><thead><tr><th>Property</th><th>Typical new-lease offer</th><th>Broker cost</th><th>Study role</th></tr></thead><tbody><tr><td>Hew</td><td>2 months free</td><td>1 month</td><td>Operating model</td></tr><tr><td>Harper</td><td>2.5 months free</td><td>1 month</td><td>Pricing comparison</td></tr></tbody></table></div><p class=\"small muted\">Offers can vary by unit and lease date. Harper\u2019s typical term is 12 months. Use the actual signed terms for a specific lease.</p></div></section>"};

everett/development", "Review the development test"]}, "renter": {"label": "LEASE PRICING", "question": "How do concessions and broker costs change the rent the owner keeps?", "result": "The same asking rent can produce very different lease income.", "meaning": "At $3,000 rent over 15 months, Anthem retains about $2,531 per month after the modeled offer and broker fee. Juniper\u2019s maximum offer retains about $2,167. This isolates incentives, not property quality.", "metrics": [["Anthem scenario owner rent", "$2,531 / mo"], ["Juniper maximum-offer scenario", "$2,167 / mo"], ["Listed units analyzed", "286"]], "basis": "Controlled 15-month scenario, not confirmed offer eligibility. Before fees, vacancy and operating expenses.", "cta": ["#lease-calculator", "Try the concession calculator"]}, "asset": {"label": "OPERATING ANALYSIS", "question": "Where should an asset manager focus within the five-building program?", "result": "Track lease income and competing supply together.", "meaning": "Juniper has 67 one-bedrooms among 118 listings. That concentration is a reason to test pricing and absorption, not a type-specific vacancy rate. Optional fees need paying-user counts before they become annual revenue.", "metrics": [["Juniper listed one-bedrooms", "67 / 118"], ["All-project listed units", "286"], ["Verified actual NOI", "Unavailable"]], "basis": "Public listing snapshot, October 17\u201319, 2026. Operating performance is not inferred from listing counts."}, "development": {"label": "DEVELOPMENT TEST", "question": "How much annual income must the reported development cost produce?", "result": "A $55M NOI target is the hurdle\u2014not a measured result.", "meaning": "At the $880M program scale, a 5% yield needs $44M annually; a 6.25% yield needs $55M. Use these thresholds to test whether rent, lease-up and cost assumptions are strong enough.", "metrics": [["Required NOI at 5%", "$44M / yr"], ["Required NOI at 6.25%", "$55M / yr"], ["Reported cost per home", "~$462K"]], "basis": "Illustrative yield targets. Reported cost may include retail and infrastructure; financing terms and actual NOI are incomplete."}, "compare": {"label": "COMPARISON", "question": "How does Everett differ from the Hew and Harper study?", "result": "One case tests property income; the other tests development scale.", "meaning": "Hew connects lease terms to NOI and value. Harper checks the location premium. Everett tests the income needed to support a phased development program. Cross-market rents are not treated as direct substitutes.", "metrics": [["Hew & Harper focus", "Operating income"], ["Everett focus", "Development hurdle"], ["Common test", "Rent \u2192 NOI \u2192 value"]], "basis": "Separate geographies and evidence sets. Compare the analysis method, not unadjusted rents or realized returns."}}};

var HARPER_OCT19="<section><div class=\"wrap\"><h2>October 19 listing snapshot</h2><p>Harper website, October 19, 2026: 41 units listed, with 37 available now and 4 available later (Oct 22, Oct 28, Nov 7, Dec 5). By type: 32 one-bedrooms, 6 studios and 3 two-bedrooms.</p><div class=\"table-scroll\"><table><thead><tr><th>Plan</th><th>Area</th><th>Monthly asking rent</th></tr></thead><tbody><tr><td>Studio S1</td><td>458–466 sq ft</td><td>$2,945–3,065</td></tr><tr><td>One-bedroom A1</td><td>622 sq ft</td><td>$3,330–3,340</td></tr><tr><td>One-bedroom A2</td><td>629 sq ft</td><td>$3,351</td></tr><tr><td>One-bedroom A3</td><td>621–651 sq ft</td><td>$3,369–3,499</td></tr><tr><td>One-bedroom A4</td><td>752 sq ft</td><td>$3,510–3,530</td></tr><tr><td>Two-bedroom B1</td><td>926 sq ft</td><td>$4,722–4,732</td></tr><tr><td>Two-bedroom B8</td><td>1,084 sq ft</td><td>$4,951</td></tr></tbody></table></div><p>Residents pay electricity, gas, water and internet directly to third-party providers, so Harper charges no building internet fee. Reserved parking is $300/month; pet rent is $75/month.</p><p>One-bedrooms make up 32 of 41 listings. Listings are not a vacancy count, but the concentration points to one-bedroom pricing as the main leasing pressure.</p><p class=\"small muted\">Listed availability is not the same as actual vacancy. The October 18 Hew vs Harper comparison remains a separate historical sample.</p></div></section>";

PAGES.hew.overview=function(){return "<section><div class=\"wrap\"><h2>What drives the result?</h2><div class=\"finding-grid\"><article><div class=\"section-kicker\">01 / LEASING COST</div><h3>$812K of annual incentives</h3><p>New-lease free rent, broker fees and renewal offers are a larger modeled loss than vacancy.</p><a class=\"secondary\" href=\"#/b/hew/asset\">Inspect the cash flow \u2192</a></article><article><div class=\"section-kicker\">02 / LOCATION</div><h3>A premium over Harper</h3><p>The sample Hew one-bedroom is about $660 more per month after free rent. The commute and renter pool help frame this difference.</p><a class=\"secondary\" href=\"#/b/hew/renter\">Compare lease pricing \u2192</a></article><article><div class=\"section-kicker\">03 / DEVELOPMENT</div><h3>4.07% yield on cost</h3><p>At the assumed $90M cost, modeled income falls short of the 6.25% target yield.</p><a class=\"secondary\" href=\"#/b/hew/development\">Test the development cost \u2192</a></article></div></div></section><section><div class=\"wrap\"><h2>The case in one minute</h2><p class=\"prose\">Hew is a 150-apartment building developed by The Davis Companies and managed by Greystar. Harper, at about 260 apartments, is the local pricing comparison. The model starts with rent by unit type, subtracts vacancy and leasing incentives, adds other income and deducts expenses to estimate NOI and value.</p><p class=\"prose\">The investment question is whether Hew\u2019s location premium survives the cost of maintaining occupancy\u2014and whether the resulting income supports the assumed cost to build.</p></div></section>";};
PAGES.hew.renter=function(){return ''+
 '<section><div class="wrap"><h2>What renters pay versus what owners keep</h2><div class="prose"><p>Hew lists the highest rents of the two buildings. After free rent its one-bedroom still costs a renter about $660 more a month than Harper’s, and Hew fills more of its units. Hew’s premium is real, but it pays heavily to protect it: three months of rent per new lease once the broker fee is counted.</p></div>'+compTableHTML()+'</div></section>'+
 '<section><div class="wrap"><h2>The renewal paradox</h2><div class="prose"><p>In 2026 Hew started offering renewing tenants one month free. Turnover fell from what I estimate at 55% or more to about 35%. Cost did not fall.</p></div>'+
  '<div class="table-scroll prose"><table><thead><tr><th></th><th class="num">No renewal offer</th><th class="num">One month for renewals</th></tr></thead><tbody>'+
  '<tr><td>Tenants replaced each year</td><td class="num">55%</td><td class="num">35%</td></tr>'+
  '<tr><td>Months lost per new lease (2 free + 1 broker)</td><td class="num">55% × 3 = 1.65</td><td class="num">35% × 3 = 1.05</td></tr>'+
  '<tr><td>Months lost per renewal</td><td class="num">0</td><td class="num">65% × 1 = 0.65</td></tr>'+
  '<tr class="total"><td>Average months lost per market unit</td><td class="num">1.65</td><td class="num">1.70</td></tr>'+
  '<tr><td>Annual cost</td><td class="num">about $788K</td><td class="num">about $812K</td></tr></tbody></table></div>'+
  '<div class="callout"><p>Keeping a tenant costs one month; replacing one costs three plus vacant days, so the offer is rational unit by unit. Given to everyone, including tenants who would have stayed anyway, it costs slightly more in total.</p></div></div></section>'+
 '<section><div class="wrap"><h2>Who rents here</h2><div class="prose"><p>Hew’s draw is location: close to campus and the Green Line, so most renters don’t need a car. Of the 60 garage spaces set aside for renters, I estimate about 35 are rented. The renter base leans toward graduate students, which keeps turnover structurally high because many programs last one or two years.</p></div></div></section>';};

PAGES.hew.asset=function(){return ''+
 '<section><div class="wrap"><h2>Year-one underwriting</h2><div class="prose"><p>Change any input and every line, the valuation and the sensitivity table update. Property tax uses an illustrative loaded-cap convention: assessed value is assumed equal to modeled value. Actual assessment and tax treatment can differ.</p></div>'+
 '<div class="model-grid"><aside class="inputs" aria-label="Model inputs"><h3>Inputs</h3>'+
  ctrl("iTurn","Annual turnover, market units","oTurn",20,70,5,"Field estimate: about 35% after the 2026 renewal offer")+
  ctrl("iFree","Free rent per new lease","oFree",0,3,0.5,"Hew today: 2 months")+
  ctrl("iBroker","Broker fee per new lease","oBroker",0,1,0.5,"Hew pays one month")+
  ctrl("iRenew","Free rent per renewal","oRenew",0,2,0.5,"")+
  ctrl("iVac","Physical vacancy","oVac",2,10,1,"Assumption based on 6 listings out of 150 units; actual vacancy unverified")+
  ctrl("iCap","Market cap rate","oCap",4.25,6.25,0.25,"Scenario input; cited market benchmark requires verification")+
  ctrl("iOpex","Operating cost per unit per year","oOpex",5500,9500,10,"Excludes tax and management fee")+

  '<button class="reset" id="resetBtn" type="button">Reset to base case</button><button class="reset" id="exportBtn" type="button">Download model CSV ↓</button></aside>'+
 '<div><div class="kpis"><div class="kpi"><div class="k">Net operating income</div><div class="v" id="kNoi">—</div></div><div class="kpi"><div class="k">Value</div><div class="v" id="kVal">—</div></div><div class="kpi"><div class="k">Value per unit</div><div class="v" id="kUnit">—</div></div><div class="kpi"><div class="k">Value per sq ft</div><div class="v" id="kSf">—</div></div><div class="kpi"><div class="k">Expense ratio</div><div class="v" id="kExp">—</div></div><div class="kpi"><div class="k">Share of condo price per sq ft</div><div class="v" id="kCondo">—</div></div></div>'+
  '<div class="table-scroll"><table><thead><tr><th>Year-one pro forma</th><th class="num">Annual</th><th class="num">Per unit</th></tr></thead><tbody id="pfBody"></tbody></table></div>'+
  '<h3>Value by cap rate and turnover</h3><p class="small muted">Shaded cell is closest to the current inputs.</p><div class="table-scroll"><table class="sens"><thead id="sensHead"></thead><tbody id="sensBody"></tbody></table></div>'+
  '<h3>Rent roll used</h3><div class="table-scroll"><table><thead><tr><th>Type</th><th class="num">Units</th><th class="num">Avg sq ft</th><th class="num">Listed rent</th><th class="num">Rent per sq ft</th></tr></thead><tbody id="rrBody"></tbody></table></div>'+
 '</div></div></div></section>'+
 '<section><div class="wrap"><h2>Reconciling the unit count</h2><div class="prose"><p>Hew’s floor plans show 150 unit numbers; the public unit list shows 123. The 27 unlisted units cluster on floor 2, where the shared artist workspace sits, and line up with the 25 restricted apartments and eight artist live/work units in the approval. The model prices them separately; confirming this is the first diligence question.</p></div>'+
  '<div class="table-scroll prose"><table><thead><tr><th>Floor</th><th class="num">Listed</th><th>Not listed</th></tr></thead><tbody>'+
  '<tr><td>2</td><td class="num">9</td><td>204–212, 214, 216 (11 units)</td></tr><tr><td>3</td><td class="num">23</td><td>302, 308, 310, 316</td></tr><tr><td>4</td><td class="num">23</td><td>417, 422, 426, 427, 428</td></tr><tr><td>5</td><td class="num">22</td><td>506, 518, 521, 525</td></tr><tr><td>6</td><td class="num">25</td><td>604</td></tr><tr><td>7</td><td class="num">21</td><td>701, 705</td></tr><tr class="total"><td>Total</td><td class="num">123</td><td>27</td></tr></tbody></table></div></div></section>'+
 '<section><div class="wrap risks"><div><h3>What I’d do as asset manager</h3><ul class="plain">'+
  '<li>Burn off concessions as the supply wave clears: cutting new-lease free rent from two months to one adds about $165K a year at today’s turnover.</li>'+
  '<li>Price incentives by unit type. Two-bedrooms lease fastest; keep incentives for studios and one-bedrooms.</li>'+
  '<li>Target renewal offers at tenants likely to leave instead of everyone.</li>'+
  '<li>Move lease expirations away from winter, when Allston–Brighton leasing nearly stops.</li></ul></div>'+
  '<div><h3>Risks and diligence</h3><ul class="plain"><li>Remaining Allston Yards phases add competing supply.</li><li>Structurally high turnover with a graduate-student base.</li><li>Actual assessed value and tax bill.</li><li>Rents and income tiers of the 27 unlisted units.</li><li>Operating costs: modeled about 15% above the national benchmark.</li></ul></div></div></section>';};
function ctrl(id,label,out,min,max,step,hint){return '<div class="ctrl"><label for="'+id+'">'+label+' <output id="'+out+'"></output></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'">'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';}

PAGES.hew.development=function(){return ''+
 '<section><div class="wrap"><h2>Would Hew pencil today?</h2><div class="prose">'+
  '<p>A developer asks whether the finished building earns enough on what it costs to build. The test is yield on cost, stabilized NOI divided by total project cost, set against the cap rate the building would sell at. Developers usually want a 1 to 1.5 point spread for construction, lease-up and market risk.</p>'+
  '<p>Davis’s budget isn’t public, so cost is the key estimate. Land is known: $15.75M for a site now holding 252 homes, about $62,500 each, allocating roughly $9.4M to Hew. That sits inside the Boston Globe’s 2023 range of $40,000–80,000 per unit for outer-neighborhood land. The same analysis put new Greater Boston apartments near $600,000 per unit all-in, with hard costs at 75–80% of the total.</p></div>'+
 '<div class="model-grid"><aside class="inputs" aria-label="Development inputs"><h3>Development inputs</h3>'+
  ctrl("iDCost","All-in cost per unit","oDCost",450000,700000,10000,"Boston Globe benchmark: about $600K per unit")+
  ctrl("iDSpread","Target spread over cap rate","oDSpread",0.5,2,0.25,"Typical developer hurdle: 1 to 1.5 points")+
  '<p class="hint" style="margin-top:14px">NOI and cap rate come from the asset manager model, so changes there flow through here.</p></aside>'+
 '<div><div class="kpis"><div class="kpi"><div class="k">Total project cost</div><div class="v" id="dTotal">—</div></div><div class="kpi"><div class="k">Yield on cost</div><div class="v" id="dYoc">—</div></div><div class="kpi"><div class="k">Spread over cap rate</div><div class="v" id="dSpreadV">—</div></div><div class="kpi"><div class="k">Value minus cost</div><div class="v" id="dCreated">—</div></div><div class="kpi"><div class="k">NOI increase for target</div><div class="v" id="dGap">—</div></div><div class="kpi"><div class="k">Max cost per unit for target</div><div class="v" id="dMax">—</div></div></div>'+
  '<div class="table-scroll"><table><thead><tr><th>Estimated cost stack</th><th class="num">Total</th><th class="num">Per unit</th><th class="num">Share</th></tr></thead><tbody id="devStack"></tbody></table></div>'+
  '<p class="small muted">Land allocated by home count across rental and condo buildings. Non-land cost split 82% hard and 18% soft and financing, following the Globe’s sample Greater Boston budget.</p>'+
  '<h3>Value minus cost by cost and cap rate</h3><div class="table-scroll"><table class="sens"><thead id="devSensHead"></thead><tbody id="devSensBody"></tbody></table></div></div></div>'+
 '<div class="callout"><p>At <span id="dcCost">—</span> per unit, Hew yields <span id="dcYoc">—</span> on cost against a <span id="dcCap">—</span> cap rate. The finished building is worth <span id="dcValue">—</span>, about <span id="dcDiff">—</span> <span id="dcDir">—</span> it would cost to build. A <span id="dcTarget">—</span> yield on cost would take <span id="dcGap">—</span> more NOI a year, roughly <span id="dcRent">—</span> higher market rents, or a cost of no more than <span id="dcMax">—</span> per unit.</p>'+
 '<p>Hew was underwritten when cap rates sat near 4%. This arithmetic explains why Davis shrank the original 330-home tower and cut hard costs about 15%, and why so few projects like it are starting now.</p></div></div></section>';};

 '<section><div class="wrap"><h2>Checking the value against the market</h2><div class="table-scroll"><table><thead><tr><th>Reference</th><th>Date</th><th class="num">Per unit</th><th>What it tells us</th></tr></thead><tbody>'+
 '<tr><td>1550 on the Charles, Brighton: 211 units, $145M, 65% financed</td><td>Aug 2022</td><td class="num">$687K</td><td>Priced at roughly 4–4.25% cap rates as hikes began. Market price then, but bought near the peak; likely about 10% lower today, which erodes roughly 28% of the equity at 65% leverage.</td></tr>'+
 '<tr><td>Boston multifamily sales, all ages</td><td>Sept 2026</td><td class="num">about $456K</td><td>Hew sits a little above the citywide average, as a 2024 building should.</td></tr>'+
 '<tr><td>Hew estimate, base case</td><td>Oct 2026</td><td class="num">'+kShort(BASER.perUnit)+'</td><td>Restricted units and heavy concessions keep it well below the 2022 peak comparable.</td></tr>'+
 '<tr><td>Condo #409 next door</td><td>2025</td><td class="num">$1,071/sq ft</td><td>Hew values at '+pct(BASER.perSf/CONDO_PSF,0)+' of the condo price per square foot, a plausible gap between investor and owner-occupier pricing.</td></tr>'+
 '</tbody></table></div></div></section>';};

PAGES.harper.overview=function(){return "<section><div class=\"wrap\"><h2>Revised operating picture</h2><p class=\"prose\">The operating hypothesis is a mismatch between one-bedroom pricing and location for the renters Harper attracts. In the author\u2019s leasing experience, students are price-sensitive here; those willing to pay a premium may choose a home closer to campus instead. Concentrated vacancy supports investigating this hypothesis but does not establish causation.</p><p class=\"small muted\">Updated author-supplied research; observation date not supplied. Unit types and current vacancy are reconstructed from the author\u2019s listing and floor-plan review, not a verified owner rent roll. The October 18 comparison elsewhere remains a separate historical snapshot.</p><div class=\"table-scroll\"><table><thead><tr><th>Type</th><th>All available</th><th>Future availability</th><th>Currently vacant*</th><th>Estimated stock</th><th>Current vacancy*</th></tr></thead><tbody><tr><td>One-bedroom</td><td>32</td><td>2</td><td>30</td><td>~120</td><td>~25%</td></tr><tr><td>Studio</td><td>6</td><td>0</td><td>6</td><td>~80</td><td>~7.5%</td></tr><tr><td>Two-bedroom</td><td>3</td><td>2</td><td>1</td><td>~50</td><td>~2%</td></tr><tr><td>Total</td><td>41</td><td>4</td><td>37</td><td>~260 overall</td><td>~14.2%</td></tr></tbody></table></div><p class=\"small muted\">*Author-classified as currently vacant. Future units 2404 and 2504 are one-bedrooms; 2402 and 2501 are two-bedrooms. Estimated type totals sum to 250, leaving roughly 10 of the assumed 260 units unallocated. No precision beyond these estimates is implied.</p><div class=\"callout\"><p><strong>Location \u00d7 price:</strong> Harper may fall between a budget-conscious student option and a premium campus-adjacent option. Roughly one in four inferred one-bedrooms is currently vacant. This is an author field hypothesis to test with signed leases and competing properties.</p></div></div></section><section><div class=\"wrap\"><h2>Opening-year leasing context</h2><p class=\"prose\">The author reports that Harper opened on August 31 and reached only about 3\u20134% occupancy during its initial lease-up period (August 31, 2025 through March 2026). This is an approximate historical field observation, not an audited annual occupancy figure. The opening date and period are author-reported; no contemporaneous occupancy report is supplied.</p><p class=\"prose\">The author\u2019s explanation is that much of the student leasing cycle had already finished before opening. This is a lease-up timing hypothesis, separate from the current one-bedroom pricing issue.</p></div></section>";};
PAGES.harper.renter=function(){return "<section><div class=\"wrap\"><h2>Updated asking rents</h2><p class=\"small muted\">Updated author-supplied research; observation date not supplied. Unit types and current vacancy are reconstructed from the author\u2019s listing and floor-plan review, not a verified owner rent roll. The October 18 comparison elsewhere remains a separate historical snapshot.</p><div class=\"table-scroll\"><table><thead><tr><th>Type</th><th>Area</th><th>Asking rent / month</th></tr></thead><tbody><tr><td>Studio S1</td><td>458\u2013466 sf</td><td>$2,945\u20133,065</td></tr><tr><td>One-bedroom A1/A2</td><td>622\u2013629 sf</td><td>$3,330\u20133,351</td></tr><tr><td>One-bedroom A3</td><td>621\u2013651 sf</td><td>$3,369\u20133,499</td></tr><tr><td>One-bedroom A4</td><td>752 sf</td><td>$3,510\u20133,530</td></tr><tr><td>Two-bedroom B1</td><td>926 sf</td><td>$4,722\u20134,732</td></tr><tr><td>Two-bedroom B8</td><td>1,084 sf</td><td>$4,951</td></tr></tbody></table></div><p class=\"prose\">The author reports many A3 listings moving from $3,457\u20133,472 to $3,369\u20133,399 over several weeks, roughly $60\u2013100 lower. The full current range still reaches $3,499; this is a directional observation, not a matched-unit rent index.</p></div></section><section><div class=\"wrap\"><h2>Why one-bedrooms may be harder to lease</h2><p class=\"prose\">At the supplied asking rents, two roommates splitting a B1 pay about $2,361\u20132,366 each, compared with $3,330\u20133,351 for an A1/A2. That is roughly $964\u2013990 less per person before concessions and fees. A studio offers a lower total monthly bill for someone living alone. Actual comparisons depend on unit, lease term and offer eligibility.</p><p class=\"prose\">The author reports Harper typically offers 2.5 months free on 12-month leases, with a one-month broker fee. Contract-rent observations are before concessions. Under those terms renter effective base rent = R × 9.5 / 12 and owner rent after concession and broker = R × 8.5 / 12; other lease terms must be treated separately.</p></div></section><section><div class=\"wrap\"><h2>Who pays the utilities?</h2><p class=\"prose\">According to the author, residents pay water, electricity, gas and internet directly to third-party providers. No mandatory internet-fee income is included for Harper. The supplied Community Fee Guide lists reserved parking at $300 per vehicle per month and pet rent at $75 per pet per month. Storage is listed at $0 / N/A and is not underwritten as income.</p><p class=\"small muted\">Parking utilization, pet participation, storage rates and common-area utility expenses are not yet known. Hew\u2019s internet-fee line is gross revenue, not verified net profit; service costs must also be reconciled.</p></div></section><section><div class=\"wrap\"><h2>Location is part of the product</h2><p class=\"prose\">Author\u2019s leasing observation: Harper is near the student rental market but still involves a walk or commute that makes premium-priced one-bedrooms harder to justify. Renters with flexible budgets may pay for greater campus proximity. By contrast, the author sees Hew\u2019s Brighton location as serving a broader pool of university and medical-area renters, including medical-area prospects using bus connections.</p><p class=\"small muted\">This is field-based market interpretation, not a verified resident demographic survey. Specific university abbreviations, routes and travel times have not been assumed.</p></div></section><section><div class=\"wrap\"><h2>Community Fee Guide \u2014 supplied screenshots, October 19, 2026</h2><div class=\"table-scroll\"><table><thead><tr><th>Item</th><th>Guide amount</th><th>Underwriting treatment</th></tr></thead><tbody><tr><td>Application</td><td>$0</td><td>No income</td></tr><tr><td>First-month rent deposit</td><td>$600 once / unit</td><td>Applied to prorated move-in rent; do not double-count</td></tr><tr><td>Third-party liability insurance</td><td>Usage-based; required</td><td>No landlord revenue assumed</td></tr><tr><td>Electric / gas and water / sewer</td><td>Usage-based; required</td><td>Third-party payments; no fee revenue assumed</td></tr><tr><td>Third-party internet</td><td>Varies; optional</td><td>No mandatory landlord internet income</td></tr><tr><td>Garbage / pest control</td><td>$0</td><td>No fee income</td></tr><tr><td>Reserved parking</td><td>$300 / vehicle / month</td><td>Recurring only for paid spaces</td></tr><tr><td>Pet rent</td><td>$75 / pet / month</td><td>Recurring only for chargeable pets</td></tr><tr><td>Pet deposit / storage</td><td>$0 / N/A</td><td>No income assumed</td></tr></tbody></table></div><p class=\"small muted\">The screenshots are a fee schedule, not proof of collections, utilization or legal enforceability. Amounts transcribed as displayed; no legal conclusion is made.</p></div></section><section><div class=\"wrap\"><h2>Conditional ancillary charges</h2><div class=\"table-scroll\"><table><thead><tr><th>Event</th><th>Amount shown</th><th>Base-case treatment</th></tr></thead><tbody><tr><td>Access-device replacement</td><td>$65 / device</td><td>Exclude until occurrence and collection data</td></tr><tr><td>Early termination</td><td>2 \u00d7 rent / lease</td><td>Exclude from recurring base case</td></tr><tr><td>Late payment</td><td>10% rent / occurrence or balance</td><td>As printed; exclude from recurring base case</td></tr><tr><td>Returned payment</td><td>$45 / occurrence</td><td>Exclude from recurring base case</td></tr><tr><td>Unit change</td><td>$1,000 / occurrence</td><td>Exclude from recurring base case</td></tr></tbody></table></div><p class=\"prose\">Recurring gross ancillary revenue = paid parking spaces \u00d7 $300 \u00d7 12 + chargeable pets \u00d7 $75 \u00d7 12. Capacity, participation, exemptions and collections are still needed; no annual amount is invented.</p></div></section>";};
PAGES.harper.asset=function(){return "<section><div class=\"wrap\"><h2>Test whether rent compensates for the commute</h2><p class=\"prose\">The author\u2019s priority is location-adjusted pricing: does Harper offer enough savings to compensate for its distance from campus? Unit mix is supporting context, not the central diagnosis. The author estimates a one-bedroom share near 48%, broadly comparable with Hew\u2019s approximately 44%. The supplied typical-floor positions imply 23 one-bedrooms out of 48 units across one floor of each building (47.9%), but building-wide weighting and the ground floor remain unresolved. This does not establish a verified building-wide mix.</p><div class=\"table-scroll\"><table><thead><tr><th>Type</th><th>All available</th><th>Future availability</th><th>Currently vacant*</th><th>Estimated stock</th><th>Current vacancy*</th></tr></thead><tbody><tr><td>One-bedroom</td><td>32</td><td>2</td><td>30</td><td>~120</td><td>~25%</td></tr><tr><td>Studio</td><td>6</td><td>0</td><td>6</td><td>~80</td><td>~7.5%</td></tr><tr><td>Two-bedroom</td><td>3</td><td>2</td><td>1</td><td>~50</td><td>~2%</td></tr><tr><td>Total</td><td>41</td><td>4</td><td>37</td><td>~260 overall</td><td>~14.2%</td></tr></tbody></table></div><h3>Next operating tests</h3><ul class=\"plain\"><li>Track one-bedroom applications and signed leases after rent changes, by plan and lease term.</li><li>Compare effective rent and days vacant before expanding concessions.</li><li>Separate current vacancy, future notices, and leased-but-not-occupied units.</li><li>Underwrite third-party utilities separately from landlord-paid common-area costs.</li></ul></div></section><section><div class=\"wrap\"><h2>Reconstructing the unit mix</h2><div class=\"table-scroll\"><table><thead><tr><th>Positions \u00b7 Building 1 (30 / floor)</th><th>Classification</th><th>Evidence</th></tr></thead><tbody><tr><td>x01, x03\u2013x05, x13\u2013x16, x25, x26, x28, x30</td><td>12 one-bedrooms</td><td>Listing-confirmed per author</td></tr><tr><td>x19\u2013x24, x27</td><td>7 studios</td><td>Examples confirm several positions; x23 is stack-inferred</td></tr><tr><td>x06, x07, x09, x12, x29</td><td>5 presumed studios</td><td>Narrow shape; unconfirmed</td></tr><tr><td>x02, x08, x10, x11, x17, x18</td><td>6 presumed two-bedrooms</td><td>Corner / larger footprint; unconfirmed</td></tr></tbody></table></div><div class=\"table-scroll\"><table><thead><tr><th>Positions \u00b7 Building 2 (18 / floor)</th><th>Classification</th><th>Evidence</th></tr></thead><tbody><tr><td>x01, x02</td><td>2 two-bedrooms</td><td>2501 / 2601 B1; 2402 B8</td></tr><tr><td>x04, x08, x11</td><td>3 one-bedrooms</td><td>2304 / 2404 / 2504 A4; 2208; 2311</td></tr><tr><td>x05, x06, x09, x12, x13, x15, x16, x18</td><td>8 presumed one-bedrooms</td><td>Similar size; unconfirmed</td></tr><tr><td>x03, x07, x17</td><td>3 presumed studios</td><td>Narrow footprint; unconfirmed</td></tr><tr><td>x10, x14</td><td>2 presumed two-bedrooms</td><td>Larger footprint; unconfirmed</td></tr></tbody></table></div><p class=\"small muted\">Stack labels describe repeated unit positions, not verified counts on every floor. The ground floor, atypical floors and restricted-unit allocations remain incomplete.</p></div></section><section><div class=\"wrap\"><h2>Data still needed for a full model</h2><ul class=\"plain\"><li>Ground-floor plan, floor counts and complete unit schedule.</li><li>Reconcile ~250 type-classified units with ~260 total; confirm restricted units and their rents.</li><li>Date-stamped listing and occupancy status, plus actual signed rent and current concessions.</li><li>Parking capacity and utilization; pet and storage participation.</li><li>Renewal rate, renewal concessions, operating expenses and property taxes.</li></ul></div></section>";};
PAGES.harper.development=function(){return "<section><div class=\"wrap\"><h2>Lease-up timing is a development risk</h2><p class=\"prose\">The author reports an August 31 opening and first-year peak occupancy of approximately 3\u20134%. Missing the student pre-leasing season may explain a slow start, but actual monthly occupancy and rent-roll records need verification before quantifying lost revenue.</p><p class=\"prose\">A future development model should separate construction, lease-up and stabilized operations. Applying today\u2019s rent roll to the opening year would obscure the carrying costs and time required to stabilize.</p></div></section><section><div class=\"wrap\"><h2>Data still needed</h2><ul class=\"plain\"><li>Opening year, first move-in date and monthly occupancy history.</li><li>Land price, construction budget, loan terms and interest carry.</li><li>Actual lease-up concessions, collected rent and stabilization date.</li><li>Verified rent roll and operating expenses for a yield-on-cost test.</li></ul><div class=\"callout\"><p>A numerical development return is not presented until these inputs can support it. The 3\u20134% observation is not used as current occupancy or as a stabilized forecast.</p></div></div></section>";};
PAGES.harper.compare=function(){return compareSection("The original local snapshot shows deeper concessions and lower listing-implied occupancy at Harper than Hew. The updated field hypothesis focuses on location-adjusted pricing.");};

PAGES.everett.overview=function(){return "<section><div class=\"wrap\"><h2>Greystar\u2019s development projects</h2><p class=\"prose\">Mason, Anthem Everett, Maxwell, Jade and Juniper form Greystar\u2019s five-project Commercial Triangle development corridor. The 1,905-home total is corroborated by a public statement from Greystar development executive Gary Kerr. This is an analytical grouping, not evidence of a single legal master-development entity.</p><div class=\"table-scroll\"><table><thead><tr><th>Project</th><th>Homes</th><th>Address</th><th>Milestone / phase</th><th>Evidence</th></tr></thead><tbody><tr><td>Mason</td><td>330</td><td>101 Mill Road</td><td>First delivery; opened 2023</td><td>Official development / construction project</td></tr><tr><td>Anthem Everett</td><td>450</td><td>484 Second Street</td><td>First move-ins announced June 2024</td><td>Greystar + Partners Group</td></tr><tr><td>Maxwell</td><td>384</td><td>102 Mill Road</td><td>Third program delivery reported</td><td>Included in development executive\u2019s program</td></tr><tr><td>Jade</td><td>325</td><td>202 Mill Road</td><td>Phase I of 741-home site</td><td>Paired with Juniper</td></tr><tr><td>Juniper</td><td>416</td><td>201 Mill Road</td><td>Groundbreaking July 2024; 2026 target</td><td>Phase II; current completion unconfirmed</td></tr></tbody></table></div><p class=\"small\">Sources checked October 19, 2026: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.greystar.com/business/services/development-and-construction/featured-projects/mason\">Greystar \u2014 Mason</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.greystar.com/business/about-greystar/newsroom/greystar-and-partners-group-welcome-first-move-ins-at-anthem-everett\">Greystar \u2014 Anthem (June 2024)</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.linkedin.com/posts/garyjkerr_were-excited-to-celebrate-even-more-milestones-activity-7224428758827454467-oQpe\">Greystar development executive \u2014 five-project program</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.multifamilyexecutive.com/design-development/greystar-spurs-new-mixed-use-neighborhood-everett\">Multifamily Executive \u2014 development interview</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.bisnow.com/news/boston/multifamily/greystar-gets-111m-construction-loan-to-start-boston-area-apartments-125108\">Bisnow \u2014 construction financing</a>.</p></div></section><section><div class=\"wrap\"><h2>What the $880M figure means</h2><p class=\"prose\">Greystar\u2019s executive described approximately $880 million of investment across the five developments. A later development interview reports approximately $875 million in total development cost. Treat $875\u2013880 million as reported program scale, not audited final cost, equity invested, current value or proceeds.</p><div class=\"callout\"><p>Greystar is involved in ground-up development. That does not establish sole ownership or the general contractor for every project. Anthem explicitly involves capital partner Partners Group.</p></div></div></section>";};
PAGES.everett.renter=function(){return "<section><div class=\"wrap\"><h2>Five-property listing snapshot</h2><p class=\"prose\">Public listing data, October 17\u201319, 2026. Prices shown are asking rents before concessions.</p><div class=\"table-scroll\"><table><thead><tr><th>Property</th><th>2026 snapshot</th><th>Listings</th><th>Studio</th><th>1BR</th><th>2BR</th><th>3BR</th></tr></thead><tbody><tr><td>Mason</td><td>Oct 18</td><td>31</td><td>15</td><td>7</td><td>9</td><td>0</td></tr><tr><td>Maxwell</td><td>Oct 19</td><td>36</td><td>13</td><td>11</td><td>12</td><td>0</td></tr><tr><td>Jade</td><td>Oct 19</td><td>16</td><td>6</td><td>4</td><td>6</td><td>0</td></tr><tr><td>Anthem Everett</td><td>Oct 17</td><td>85</td><td>21</td><td>27</td><td>37</td><td>0</td></tr><tr><td>Juniper</td><td>Oct 19</td><td>118</td><td>20</td><td>67</td><td>22</td><td>9</td></tr></tbody></table></div><p class=\"small muted\">286 listings across five properties. Listing dates differ and some homes are available in the future. These counts do not measure actual vacancy. Anthem\u2019s detailed list has 85 units; an earlier summary says 88. The table uses the detailed list.</p></div></section><section><div class=\"wrap\"><h2>Asking rent by bedroom count</h2><div class=\"table-scroll\"><table><thead><tr><th>Property</th><th>Type</th><th>Listings</th><th>Asking range</th><th>Mean asking</th><th>Aggregate $/sf</th></tr></thead><tbody><tr><td>Mason</td><td>Studio</td><td>15</td><td>$2,215\u20132,530</td><td>$2,361</td><td>$4.61</td></tr><tr><td>Mason</td><td>1 Bedroom</td><td>7</td><td>$2,540\u20132,870</td><td>$2,690</td><td>$4.24</td></tr><tr><td>Mason</td><td>2 Bedrooms</td><td>9</td><td>$2,935\u20133,900</td><td>$3,417</td><td>$3.41</td></tr><tr><td>Maxwell</td><td>Studio</td><td>13</td><td>$2,350\u20132,860</td><td>$2,583</td><td>$4.73</td></tr><tr><td>Maxwell</td><td>1 Bedroom</td><td>11</td><td>$2,375\u20133,100</td><td>$2,865</td><td>$4.31</td></tr><tr><td>Maxwell</td><td>2 Bedrooms</td><td>12</td><td>$3,299\u20134,095</td><td>$3,715</td><td>$3.57</td></tr><tr><td>Jade</td><td>Studio</td><td>6</td><td>$2,375\u20132,600</td><td>$2,518</td><td>$4.58</td></tr><tr><td>Jade</td><td>1 Bedroom</td><td>4</td><td>$2,650\u20133,400</td><td>$2,954</td><td>$4.19</td></tr><tr><td>Jade</td><td>2 Bedrooms</td><td>6</td><td>$3,600\u20134,025</td><td>$3,781</td><td>$3.55</td></tr><tr><td>Anthem Everett</td><td>Studio</td><td>21</td><td>$2,399\u20132,700</td><td>$2,558</td><td>$4.72</td></tr><tr><td>Anthem Everett</td><td>1 Bedroom</td><td>27</td><td>$2,525\u20133,575</td><td>$3,067</td><td>$4.46</td></tr><tr><td>Anthem Everett</td><td>2 Bedrooms</td><td>37</td><td>$3,199\u20133,950</td><td>$3,634</td><td>$3.54</td></tr><tr><td>Juniper</td><td>Studio</td><td>20</td><td>$2,520\u20132,795</td><td>$2,680</td><td>$4.78</td></tr><tr><td>Juniper</td><td>1 Bedroom</td><td>67</td><td>$2,780\u20133,205</td><td>$2,986</td><td>$4.51</td></tr><tr><td>Juniper</td><td>2 Bedrooms</td><td>22</td><td>$3,660\u20134,200</td><td>$3,870</td><td>$3.97</td></tr><tr><td>Juniper</td><td>3 Bedrooms</td><td>9</td><td>$5,380\u20135,690</td><td>$5,559</td><td>$4.57</td></tr></tbody></table></div><p class=\"small muted\">Mean rent is the average of listed units. $/sf is total listed monthly rent divided by total listed area. Available homes may not represent the whole building; plan suffixes do not establish affordable status.</p><p><a href=\"everett-listings.json\" download>Download listing data (JSON)</a></p></div></section><section><div class=\"wrap\"><h2>Offers checked on the official websites</h2><div class=\"table-scroll\"><table><thead><tr><th>Property</th><th>Current public offer</th><th>Quoted lease examples</th><th>Owner broker cost assumption</th></tr></thead><tbody><tr><td>Mason</td><td>8 weeks; prior market observation</td><td>Scenario term; not rechecked here</td><td>1 month</td></tr><tr><td>Maxwell</td><td>6 weeks base rent free</td><td>15 months on current property cards</td><td>1 month</td></tr><tr><td>Jade</td><td>Up to 6 weeks base rent free</td><td>24 months on studio examples; 20 on several 1BR / 2BR cards</td><td>1 month</td></tr><tr><td>Anthem</td><td>8 weeks base rent free</td><td>15 months on current property cards</td><td>0.5 month</td></tr><tr><td>Juniper</td><td>Up to 3 months base rent free + $500 credit</td><td>24-month examples on official leasing portal</td><td>1 month</td></tr></tbody></table></div><p class=\"small\">Official websites checked October 19, 2026: <a href=\"https://livemaxwellma.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Maxwell</a> \u00b7 <a href=\"https://jadeevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Jade</a> \u00b7 <a href=\"https://anthemeverett.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Anthem</a> \u00b7 <a href=\"https://juniperevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Juniper</a>.</p><p>Published lease examples are not minimum qualifying terms. The promotions mention restrictions but do not state a complete unit-by-unit eligibility schedule or a clear move-in deadline in the pages checked. Juniper mentions a minimum term without giving the number. The calculator therefore shows scenarios, not guaranteed offers. Broker costs remain market assumptions; the public pages do not verify them.</p></div></section><section id=\"lease-calculator\"><div class=\"wrap\"><h2>Lease economics calculator</h2><div class=\"inputs\" style=\"position:static;max-width:650px\"><label for=\"offerProperty\">Property / offer</label><select id=\"offerProperty\" style=\"width:100%;padding:9px;font:inherit\"><option value=\"mason\">Mason \u00b7 8 weeks</option><option value=\"maxwell\">Maxwell \u00b7 6 weeks</option><option value=\"jade\">Jade \u00b7 up to 6 weeks</option><option value=\"anthem\">Anthem \u00b7 8 weeks</option><option value=\"juniper\">Juniper \u00b7 maximum 3 months + $500</option></select><label for=\"mRent\">Contract / asking monthly rent ($)</label><input id=\"mRent\" type=\"number\" min=\"1\" max=\"20000\" value=\"2215\" step=\"1\" style=\"width:100%;padding:9px;font:inherit\"><label for=\"mTerm\">Lease length (months)</label><select id=\"mTerm\" style=\"width:100%;padding:9px;font:inherit\"><option>12</option><option>13</option><option>15</option><option>18</option><option>20</option><option>24</option></select><p id=\"offerNote\" class=\"small muted\"></p><p>Renter effective rent: <strong id=\"mTenant\"></strong><br>Owner rent after concession + broker: <strong id=\"mOwner\"></strong></p></div><p class=\"small muted\">52-week approximation: free-rent monthly equivalent F = weeks \u00d7 12 / 52. For monthly offers, F is the stated free months. Renter effective = [R \u00d7 (L \u2212 F) \u2212 credit] / L; owner rent = [R \u00d7 (L \u2212 F \u2212 broker months) \u2212 credit] / L. Juniper assumes the full $500 reduces renter cost and is owner-funded. Fees, vacancy and expenses excluded; this is not NOI. Term selection is a scenario, not confirmation that the offer qualifies.</p></div></section><section><div class=\"wrap\"><h2>Same rent and term: isolate concession cost</h2><div class=\"table-scroll\"><table><thead><tr><th>Offer</th><th>Rent assumption</th><th>Term</th><th>Renter effective</th><th>Owner after broker</th></tr></thead><tbody><tr><td>Mason / 8 weeks</td><td>$3,000</td><td>15 months</td><td>$2,631</td><td>$2,431</td></tr><tr><td>Maxwell / Jade / 6 weeks</td><td>$3,000</td><td>15 months</td><td>$2,723</td><td>$2,523</td></tr><tr><td>Anthem / 8 weeks</td><td>$3,000</td><td>15 months</td><td>$2,631</td><td>$2,531</td></tr><tr><td>Juniper / maximum offer</td><td>$3,000</td><td>15 months</td><td>$2,367</td><td>$2,167</td></tr></tbody></table></div><p class=\"small muted\">Controlled scenario only: identical $3,000 base rents and 15-month leases isolate incentives. Broker fee assumptions: Anthem 0.5 month; all other properties 1 month. Actual unit pricing, qualifying terms, fees and demand differ. Anthem\u2019s half-month broker cost preserves $100/month more than a one-month broker fee in this scenario.</p></div></section><section><div class=\"wrap\"><h2>Official fee guides</h2><div class=\"table-scroll\"><table><thead><tr><th>Monthly optional service</th><th>Maxwell</th><th>Jade</th><th>Anthem</th><th>Juniper</th></tr></thead><tbody><tr><td>Internet</td><td>$60</td><td>$60</td><td>$60</td><td>$60</td></tr><tr><td>Garage parking</td><td>$125</td><td>$125</td><td>$100\u2013150</td><td>$150</td></tr><tr><td>Pet rent / pet</td><td>$50\u201375</td><td>$50\u201375</td><td>$50\u201375</td><td>$50\u201375</td></tr><tr><td>Storage / item</td><td>$50\u2013150</td><td>$50\u2013150</td><td>$50</td><td>$50\u2013150</td></tr><tr><td>Property insurance program</td><td>$18.75\u201321.25</td><td>$18.75\u201321.25</td><td>$18.75\u201321.25</td><td>$20</td></tr><tr><td>Credit reporting / person</td><td>$6.95</td><td>$6.95</td><td>$6.95</td><td>$6.95</td></tr><tr><td>Short-term lease charge</td><td>$300\u20132,000</td><td>$300\u20132,000</td><td>$300\u20132,000</td><td>$300\u20132,000</td></tr><tr><td>EV parking</td><td>Variable event charge</td><td>Not included in this summary</td><td>Variable event charge</td><td>$200 / item</td></tr></tbody></table></div><p class=\"small\">Official websites checked October 19, 2026: <a href=\"https://livemaxwellma.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Maxwell</a> \u00b7 <a href=\"https://jadeevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Jade</a> \u00b7 <a href=\"https://anthemeverett.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Anthem</a> \u00b7 <a href=\"https://juniperevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Juniper</a>.</p><p>All four guides mark these monthly services as optional. Required utilities and insurance are separate. Do not add every service to every apartment, or count third-party charges as owner revenue. Refundable deposits are excluded from recurring income.</p><p>Maxwell and Jade list credit reporting as paid to a third party; Juniper does too. Jade and Juniper show monthly / application timing. Paid parking, storage and pets still need participation counts before annual revenue can be estimated.</p><p class=\"small muted\">Guides issued October 19, 2026. Anthem guest parking is $10 per vehicle per day; Maxwell and Jade list $10 per event. Juniper\u2019s EV charge is listed separately from garage parking; whether a resident pays both needs a lease-specific quote. Mason\u2019s earlier listed fees remain unverified and are not treated as confirmed mandatory charges.</p></div></section><section><div class=\"wrap\"><h2>What this means for underwriting</h2><p class=\"prose\">Juniper has 67 one-bedrooms among 118 listings (56.8%); Mason has 15 studios among 31 (48.4%). These concentrations identify where to investigate absorption but do not measure type-specific vacancy without each property\u2019s complete inventory. Changes in the mean asking rent can be caused by a changing mix of available units rather than rent growth on the same units.</p><p class=\"prose\">Public fee guides and current offers have now been checked. The next operating inputs are actual fee participation, renewal terms and expenses. Keep listing-based analysis separate from verified occupancy. Contract rents are before concessions. Canceled quotes do not show actual occupancy.</p></div></section>";};
PAGES.everett.asset=function(){return "<section><div class=\"wrap\"><h2>How do the five buildings compete?</h2><p class=\"prose\">Research hypothesis: phased deliveries can create neighborhood scale while competing for the same prospective residents. The model must distinguish net new demand from transfers between sister buildings.</p><ul class=\"plain\"><li>Track lease-up velocity, concessions and renewals separately by project.</li><li>Measure internal transfers and shared lead conversion before claiming portfolio synergies.</li><li>Separate residential, retail and parking revenue and their operating costs.</li><li>Use actual property-level fee guides; Harper\u2019s fee schedule is not transferable.</li></ul><h3>Needed before an NOI valuation</h3><p>Complete unit mix, signed rent roll, current vacancy by status, restricted rents, recurring fee collections, property taxes, insurance and operating statements. No numerical portfolio NOI is asserted without these inputs.</p></div></section>";};
PAGES.everett.development=function(){return "<section><div class=\"wrap\"><h2>How the development was phased</h2><p class=\"prose\">The development interview describes a first construction start in June 2021 and an initial parcel that expanded into multiple opportunities. Jade and Juniper comprise a 741-home two-phase site; Mason, Anthem and Maxwell bring the corridor to 1,905 homes. A 2026 target for Juniper is a reported schedule, not proof of completion.</p><p class=\"small\">Sources checked October 19, 2026: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.greystar.com/business/services/development-and-construction/featured-projects/mason\">Greystar \u2014 Mason</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.greystar.com/business/about-greystar/newsroom/greystar-and-partners-group-welcome-first-move-ins-at-anthem-everett\">Greystar \u2014 Anthem (June 2024)</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.linkedin.com/posts/garyjkerr_were-excited-to-celebrate-even-more-milestones-activity-7224428758827454467-oQpe\">Greystar development executive \u2014 five-project program</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.multifamilyexecutive.com/design-development/greystar-spurs-new-mixed-use-neighborhood-everett\">Multifamily Executive \u2014 development interview</a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.bisnow.com/news/boston/multifamily/greystar-gets-111m-construction-loan-to-start-boston-area-apartments-125108\">Bisnow \u2014 construction financing</a>.</p></div></section><section><div class=\"wrap\"><h2>What income would cover the cost?</h2><div class=\"table-scroll\"><table><thead><tr><th>Reported cost convention</th><th>Cost / home (derived)</th><th>NOI needed at 5% yield</th><th>NOI needed at 6.25% yield</th></tr></thead><tbody><tr><td>$875M program</td><td>$459,318</td><td>$43.75M / year</td><td>$54.69M / year</td></tr><tr><td>$880M program</td><td>$461,942</td><td>$44.00M / year</td><td>$55.00M / year</td></tr></tbody></table></div><p class=\"small muted\">Derived arithmetic: reported cost \u00f7 1,905; required NOI = cost \u00d7 scenario yield. 5% and 6.25% are illustrative hurdles, not verified Everett market cap rates. Program cost may include nonresidential scope; these per-home figures are not directly comparable to apartment-only cost.</p></div></section><section><div class=\"wrap\"><h2>Financing evidence and remaining gaps</h2><p class=\"prose\">Bisnow reported a $111M Banco Inbursa construction loan for Juniper and a $100M Brookline Bank loan for the adjacent Jade project. These are reported debt facilities, not total project costs or equity. Loan-to-cost and levered IRR cannot be derived without the full capitalization and draw schedules.</p><ul class=\"plain\"><li>Verify parcel-level land basis, entitlements and remediation.</li><li>Reconcile budget scope, retail costs and shared infrastructure.</li><li>Obtain loan rates, maturity, draw timing and guarantees.</li><li>Model monthly construction carry, lease-up burn and stabilized cash flow.</li><li>Verify current completion and absorption before evaluating realized performance.</li></ul></div></section>";};
PAGES.everett.compare=function(){return "<section><div class=\"wrap\"><h2>Three research roles</h2><div class=\"table-scroll\"><table><thead><tr><th>Case</th><th>Greystar role supported here</th><th>Research question</th></tr></thead><tbody><tr><td>Hew</td><td>Property manager; Davis developer per supplied local research</td><td>Does operating cash flow support value and replacement cost?</td></tr><tr><td>Harper</td><td>Quarterra development per supplied local research</td><td>Does the rent compensate students for the location?</td></tr><tr><td>Everett corridor</td><td>Development sponsor; project partners vary</td><td>Does phased neighborhood development earn its required return?</td></tr></tbody></table></div><p class=\"prose\">Cross-market rent, cost and returns require matched dates, scope and financing assumptions.</p></div></section>";};

function methodHTML(){return "<div class=\"page\"><section><div class=\"wrap\"><h2>Sources and assumptions</h2><div class=\"callout\"><p>Based on public listings, public records and stated assumptions. Values, costs and returns are estimates, not the owners\u2019 reported results. Leasing observations are used to frame questions; listing counts do not prove occupancy.</p></div><h3>Public data</h3><p>Property websites provide asking rents, listed availability, fees and offers. Public records, developer announcements and reporting provide project sizes, financing and development history. Dates are shown where available.</p><h3>Working assumptions</h3><p>Vacancy, turnover, renewal incentives, expenses, restricted rents and construction cost are estimates unless supported by records. Change the model inputs to test a different view.</p><h3>What the numbers mean</h3><ul class=\"plain\"><li>Listed availability is not the same as actual vacancy.</li><li>Contract rent is before concessions; effective rent spreads discounts over the lease.</li><li>Owner rent after broker costs is revenue, not net operating income.</li><li>Hew is a single-year, unlevered model. It does not calculate debt service or IRR.</li><li>Hew\u2019s property tax assumes assessed value equals modeled value. Actual tax bills may differ.</li><li>The 27 unlisted Hew units are assumed restricted; approval records reference 25. Confirm the unit schedule and rents.</li><li>Everett\u2019s reported program cost may include retail and shared infrastructure. Per-home cost is not apartment-only cost.</li></ul><h3>Current leasing sources</h3><p class=\"small\">Official websites checked October 19, 2026: <a href=\"https://livemaxwellma.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Maxwell</a> \u00b7 <a href=\"https://jadeevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Jade</a> \u00b7 <a href=\"https://anthemeverett.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Anthem</a> \u00b7 <a href=\"https://juniperevt.com/floorplans/\" target=\"_blank\" rel=\"noopener\">Juniper</a>.</p><p>The four property fee guides were checked directly. Public offers are shown with their restrictions; lease quotes are not assumed to be minimum qualifying terms.</p><h3>Selected sources</h3><ul class=\"plain sources\"><li><a href=\"https://www.greystar.com/business/services/development-and-construction/featured-projects/mason\">Greystar: Mason development</a></li><li><a href=\"https://www.greystar.com/business/about-greystar/newsroom/greystar-and-partners-group-welcome-first-move-ins-at-anthem-everett\">Greystar: Anthem opening</a></li><li><a href=\"https://www.multifamilyexecutive.com/design-development/greystar-spurs-new-mixed-use-neighborhood-everett\">Everett development interview</a></li><li><a href=\"https://www.bisnow.com/news/boston/multifamily/greystar-gets-111m-construction-loan-to-start-boston-area-apartments-125108\">Everett construction financing</a></li><li><a href=\"https://anthemeverett.com/floorplans/\">Anthem: listings and fee guide</a></li><li><a href=\"https://beta.nerej.com/sower-dragos-and-jacoby-of-colliers-handle-15-75-million-sale\">Hew site acquisition</a></li><li><a href=\"https://www.boston.gov/node/726\">Boston property tax information</a></li></ul><p>Leasing-market observations help explain demand. They are not owner-certified operating results. The public-listing dataset can be downloaded from the Everett rental page.</p></div></section></div>";}
